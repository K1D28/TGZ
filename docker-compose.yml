version: '3.8'
services:
  backend:
    build:
      context: ./snack-voucher-app/server
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    env_file:
      - ./snack-voucher-app/server/.env

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    env_file:
      - ./client/.env
